permissions:
  actions: read
  checks: read
  contents: read
  deployments: none
  id-token: write
  issues: none
  packages: none
  pull-requests: none
  repository-projects: none
  security-events: write
  statuses: none
  
on:
  workflow_call:
    inputs:
      workspace:
        description: 'Workspace to use'
        required: true
        type: string


jobs:
  terraform_workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'

      - name: Configure AWS Credentials For Terraform
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ vars.OIDC_DEVELOPMENT_TEST_RUNNER_ROLE }}
          role-duration-seconds: 3600
          role-session-name: OPGLPACodesIntegrationTests

      - name: Install dependencies
        env:
          TF_WORKSPACE: ${{ inputs.workspace }}
        working-directory: scripts/ci_pipeline/load_testing
        run: |
          if [ "${TF_WORKSPACE}" == "development" ]
            then
              echo "Running against development"
              export BRANCH="dev"
            else
              echo "Running against branch environment"
              export BRANCH="${TF_WORKSPACE}.dev"
            fi
            go run load_testing.go
